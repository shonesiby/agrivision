{% extends "base_user.html" %}

{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div
    style="background: white; border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; border: 1px solid rgba(0,0,0,0.03);">
    <form action="/EditProfile" method="post">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark);">User
                ID</label>
            <input type="text" name="user_id" value="{{ data['user_id'] }}" readonly
                style="background: #f3f4f6; cursor: not-allowed; width: 100%; padding: 12px 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark);">Name</label>
            <input type="text" name="name" value="{{ data['name'] }}" required
                style="width: 100%; padding: 12px 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background: #FFF; transition: all 0.3s ease;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark);">Phone</label>
            <input type="text" name="phone" value="{{ data['phone'] }}" required pattern="[0-9]{10}"
                title="Must be a 10 digit number"
                style="width: 100%; padding: 12px 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background: #FFF; transition: all 0.3s ease;">
        </div>
        <div style="margin-bottom: 20px;">
            <label
                style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark);">Address</label>
            <textarea name="address" rows="3" required
                style="width: 100%; padding: 12px 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background: #FFF; transition: all 0.3s ease;">{{ data['address'] }}</textarea>
        </div>
        <div style="margin-bottom: 30px;">
            <label
                style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark);">Password</label>
            <input type="text" name="password" value="{{ data['password'] }}" required
                style="width: 100%; padding: 12px 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background: #FFF; transition: all 0.3s ease;">
        </div>
        <div style="text-align: center;">
            <button type="submit" class="btn btn-solid" style="width: 100%; font-size: 16px; padding: 12px;"><i
                    class="fa-solid fa-floppy-disk" style="margin-right: 8px;"></i> Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
