{% extends "base_admin.html" %}

{% block title %}Edit Branch{% endblock %}
{% block page_title %}Edit Branch Attributes{% endblock %}

{% block content %}
<form id="form1" name="form1" method="post" action="/EditDepartment">
    <input type="hidden" name="id" value="{{ data['branch_id'] }}" />
    
    <table>
        <tr>
            <th>Field</th>
            <th>Value</th>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea name="TxtAddress" rows="3" required>{{ data['address'] }}</textarea></td>
        </tr>
        <tr>
            <td>Phone</td>
            <td><input type="text" name="TxtPhone" value="{{ data['phone'] }}" required pattern="[6-9]{1}[0-9]{9}" title="Incorrect phone no" /></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" name="TxtEmail" value="{{ data['email'] }}" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" /></td>
        </tr>
        <tr>
            <td>Pincode</td>
            <td><input type="text" name="TxtPincode" value="{{ data['pincode'] }}" required pattern="[1-9]{1}[0-9]{5}" title="Incorrect pincode" /></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" name="TxtPassword" value="{{ data['password'] }}" required /></td>
        </tr>
        <tr>
            <td></td>
            <td><button type="submit" name="Submit" class="btn btn-solid">Update Branch</button></td>
        </tr>
    </table>
</form>
{% endblock %}
