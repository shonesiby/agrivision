{% extends "base_admin.html" %}
{% block title %}System Reports{% endblock %}

{% block hero %}
<section class="hero"
    style="padding: 120px 5% 40px; background: linear-gradient(135deg, rgba(236, 253, 245, 0.5) 0%, rgba(255, 255, 255, 0.9) 100%); position: relative;">
    <div style="margin-bottom: 20px;">
        <a href="Adminhome"
            style="color: var(--primary); font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Dashboard
        </a>
    </div>
    <div style="text-align: center; width: 100%;">
        <h1 style="font-size: 36px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.5px;">Platform Reports
        </h1>
        <p style="color: var(--text-light); font-size: 16px; margin-top: 10px; font-weight: 500;">Generate, view in PDF,
            and export CSV/Excel reports for platform activity.</p>
    </div>
</section>
{% endblock %}

{% block content %}
<style>
    .page-header {
        display: none !important;
    }

    .report-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.03);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        cursor: pointer;
    }

    .report-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.2);
    }

    .report-card.active {
        border: 2px solid var(--primary);
        background: rgba(236, 253, 245, 0.3);
    }
</style>
<div style="display: flex; flex-direction: column; gap: 30px; margin-top: 10px; max-width: 900px; margin: 0 auto;">

    <form action="/AdminGenerateReport" method="POST" id="reportForm">
        <h3 style="font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 20px;">Select Report Type
        </h3>

        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <!-- Farm Ops -->
            <label class="report-card">
                <input type="radio" name="report_type" value="farming" required style="display: none;"
                    onchange="updateCards(this)">
                <div style="text-align: center;">
                    <i class="fa-solid fa-tractor"
                        style="font-size: 32px; color: var(--primary); margin-bottom: 15px;"></i>
                    <h4 style="font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px;">Farming
                        Operations</h4>
                    <p style="font-size: 14px; color: var(--text-light); line-height: 1.5;">Registrations and farm
                        profiles created across all districts.</p>
                </div>
            </label>

            <!-- Subsidies -->
            <label class="report-card">
                <input type="radio" name="report_type" value="subsidies" required style="display: none;"
                    onchange="updateCards(this)">
                <div style="text-align: center;">
                    <i class="fa-solid fa-hand-holding-dollar"
                        style="font-size: 32px; color: #f59e0b; margin-bottom: 15px;"></i>
                    <h4 style="font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px;">
                        Subsidies Claimed</h4>
                    <p style="font-size: 14px; color: var(--text-light); line-height: 1.5;">Details of applied
                        users, program names and approval.</p>
                </div>
            </label>

            <!-- Branch Performance -->
            <label class="report-card">
                <input type="radio" name="report_type" value="branch" required style="display: none;"
                    onchange="updateCards(this)">
                <div style="text-align: center;">
                    <i class="fa-solid fa-code-branch"
                        style="font-size: 32px; color: #3b82f6; margin-bottom: 15px;"></i>
                    <h4 style="font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px;">Branch
                        Performance</h4>
                    <p style="font-size: 14px; color: var(--text-light); line-height: 1.5;">Aggregated analytics on
                        branch registered farmers.</p>
                </div>
            </label>
        </div>

        <h3 style="font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 20px;">Select Time Range
        </h3>
        <div
            style="background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); margin-bottom: 40px;">
            <select name="time_range"
                style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 16px; font-weight: 500; color: var(--text-dark); outline: none;">
                <option value="All-Time">All Time (Historically)</option>
                <option value="Year">This Year</option>
                <option value="Quarter">This Quarter</option>
                <option value="Month">This Month</option>
            </select>
        </div>

        <div style="display: flex; gap: 20px;">
            <button type="submit" formaction="/AdminGenerateReport" class="btn btn-outline"
                style="flex: 1; padding: 15px; font-size: 16px;"><i class="fa-solid fa-desktop"
                    style="margin-right: 8px;"></i> View HTML / PDF Report</button>
            <button type="submit" formaction="/AdminDownloadCSV" class="btn btn-solid"
                style="flex: 1; padding: 15px; font-size: 16px;;"><i class="fa-solid fa-file-csv"
                    style="margin-right: 8px;"></i> Download CSV (Excel)</button>
        </div>
    </form>
</div>

<script>
    function updateCards(selectedInput) {
        document.querySelectorAll('.report-card').forEach(card => card.classList.remove('active'));
        selectedInput.closest('.report-card').classList.add('active');
    }
</script>
{% endblock %}
