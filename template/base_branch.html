<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}Agrivision Branch{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary: #10B981;
            /* Emerald Green */
            --primary-dark: #059669;
            --secondary: #F59E0B;
            /* Amber */
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --bg-light: #F3F4F6;
            --white: #FFFFFF;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            background-color: var(--white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex-grow: 1;
        }

        .page-header {
            background: linear-gradient(135deg, rgba(236, 253, 245, 0.8) 0%, rgba(255, 255, 255, 0.9) 100%);
            padding: 120px 5% 40px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
            animation: slideInDown 0.6s ease;
        }

        .content-container {
            padding: 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.8s ease;
            overflow-x: auto;
        }

        /* Forms and Tables Overrides */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
            font-weight: 600;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #E5E7EB;
            color: var(--text-dark);
        }

        tr:hover td {
            background-color: var(--bg-light);
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #F9FAFB;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            background: var(--white);
        }

        input[type="submit"] {
            cursor: pointer;
        }

        /* NAVBAR shared styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-logo i {
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-solid,
        .section-btn {
            background: var(--primary);
            color: var(--white) !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            text-decoration: none !important;
        }

        .btn-solid:hover,
        .section-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
            color: var(--white) !important;
        }

        .btn-danger {
            background: #EF4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: #DC2626;
            transform: translateY(-2px);
        }

        .mobile-menu-btn {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* FOOTER */
        footer {
            background: var(--text-dark);
            color: var(--white);
            padding: 40px 5% 30px;
            margin-top: auto;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .scroll-top {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .scroll-top:hover {
            background: var(--primary-dark);
            transform: translateY(-5px);
        }

        @media (max-width: 991px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            {
            % block extra_css %
        }

            {
            % endblock %
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="Branchhome" class="brand-logo">
            <i class="fa-solid fa-seedling"></i>
            Agrivision
        </a>

        <div class="nav-links">
            <!-- Nav links moved to BranchHome as buttons -->
        </div>

        <div class="nav-actions">
            <a href="LogOut" class="btn btn-danger">Log Out</a>
            <button class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <main>
        {% block hero %}{% endblock %}

        {% if self.content() %}
        {% if request.endpoint not in ['Branchhome', 'login1'] %}
        <div class="page-header" style="position: relative;">
            <a href="Branchhome"
                style="position: absolute; left: 5%; top: 50%; transform: translateY(-50%); text-decoration: none; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 15px; transition: all 0.3s ease;"
                onmouseover="this.style.color='var(--primary-dark)'; this.style.transform='translateY(-50%) translateX(-5px)'"
                onmouseout="this.style.color='var(--primary)'; this.style.transform='translateY(-50%)'">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
            <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
        </div>
        {% endif %}

        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
        {% endif %}
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 Branch Portal. All rights reserved.</p>
            <a href="#" class="scroll-top">
                <i class="fa-solid fa-arrow-up"></i>
            </a>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script>
        window.addEventListener("scroll", function () {
            var navbar = document.querySelector(".navbar");
            if (window.scrollY > 50) {
                navbar.style.padding = "15px 5%";
                navbar.style.boxShadow = "0 4px 15px rgba(0,0,0,0.1)";
            } else {
                navbar.style.padding = "20px 5%";
                navbar.style.boxShadow = "0 4px 6px -1px rgba(0, 0, 0, 0.05)";
            }
        });

        {% block extra_js %} {% endblock %}
    </script>
</body>

</html>
